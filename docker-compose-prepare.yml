services:
   db-migrate:
    container_name: plane-db-migrate
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile.dev
    restart: "no"
    networks:
      - dev_env
    command: ["bunx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
 

 
  api-ts:
    container_name: plane-api-ts
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    networks:
      - dev_env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      PORT: 8001
      NODE_ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
      JWT_SECRET: ${SECRET_KEY:-plane-jwt-secret}
    ports:
      - "8001:8001"

  # ── Chat plugin backend (own service, shares the Plane DB by default) ──────
  chat-migrate:
    container_name: plane-chat-migrate
    build:
      context: ./apps/chat-backend
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - dev_env
    command: ["bun", "run", "scripts/migrate.ts"]
    environment:
      # Shares the Plane Postgres (chat_* tables). Set CHAT_DATABASE_URL only to
      # point the chat plugin at a separate database.
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
  
  chat-backend:
    container_name: plane-chat-backend
    build:
      context: ./apps/chat-backend
      dockerfile: Dockerfile
    # Hot-reload: source files are mounted so code changes are picked up
    # automatically without rebuilding the container (bun --watch fully restarts
    # the process on any file change, which is safer for a WS server).
    command: ["bun", "run", "--watch", "src/index.ts"]
    volumes:
      - ./apps/chat-backend/src:/app/src
      # Anexos do chat gravados em disco. Sem este volume os arquivos ficam na
      # camada gravável do container e somem em qualquer recriação — inclusive
      # nos `docker compose run --rm` usados pelos importadores.
      - chatmedia:/app/media
    restart: unless-stopped
    networks:
      - dev_env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      CHAT_PORT: 8002
      JWT_SECRET: ${SECRET_KEY:-plane-jwt-secret}
      NODE_ENV: development
      # Public base for media links forwarded to WhatsApp (Z-API needs a URL).
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://localhost/chat-api}
      # Optional S3 for chat media (else local disk):
      CHAT_S3_ENDPOINT: ${CHAT_S3_ENDPOINT:-}
      CHAT_S3_REGION: ${CHAT_S3_REGION:-}
      CHAT_S3_BUCKET: ${CHAT_S3_BUCKET:-}
      CHAT_S3_ACCESS_KEY: ${CHAT_S3_ACCESS_KEY:-}
      CHAT_S3_SECRET_KEY: ${CHAT_S3_SECRET_KEY:-}
    depends_on:
      - chat-migrate
    ports:
      - "8002:8002"

  proxy:
    container_name: plane-proxy
    build:
      context: ./apps/proxy-ts
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api-ts
      - web
      - chat-backend
    ports:
      - "80:80"

  web:
    container_name: plane-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile.web.local
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "3000:3000"

  admin:
    container_name: plane-admin
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.admin.local
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "3001:3000"

  # On-demand password reset. Does NOT run on a normal `docker compose up` (gated
  # behind the "tools" profile). Run it explicitly:
  #   RESET_EMAIL=fulano@empresa.com RESET_PASSWORD=novaSenha \
  #     docker compose -f docker-compose-local.yml --profile tools run --rm password-reset
  #   # or reset everyone back to the default:
  #   RESET_ALL=true docker compose -f docker-compose-local.yml --profile tools run --rm password-reset
  password-reset:
    container_name: plane-password-reset
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile
    restart: "no"
    profiles: ["tools"]
    networks:
      - dev_env
    command: ["bun", "run", "scripts/reset-password.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      RESET_EMAIL: ${RESET_EMAIL:-}
      RESET_ALL: ${RESET_ALL:-false}
      RESET_PASSWORD: ${RESET_PASSWORD:-teste}
      INCLUDE_ADMINS: ${INCLUDE_ADMINS:-false}
      KEEP_AUTOSET: ${KEEP_AUTOSET:-false}
      DRY_RUN: ${DRY_RUN:-false}
    depends_on:
      - plane-db

  sac-migrator:
    container_name: plane-sac-migrator
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - dev_env
    command: ["bun", "run", "scripts/migrate-sac.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      MYSQL_HOST: ${MYSQL_HOST:-10.1.2.32}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-developer}
      MYSQL_PASS: ${MYSQL_PASS:-qualitydev}
      MYSQL_DB: ${MYSQL_DB:-quality_site_dev}
      WORKSPACE_SLUG: ${WORKSPACE_SLUG:-quality}
      DRY_RUN: ${DRY_RUN:-false}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      LIMIT_RECORDS: ${LIMIT_RECORDS:-0}
      SKIP_COMMENTS: ${SKIP_COMMENTS:-false}
      SKIP_VISITS: ${SKIP_VISITS:-false}
    depends_on:
      - plane-db

volumes:
  redisdata:
  uploads:
  pgdata:
  chatmedia:

networks:
  dev_env:
    driver: bridge
